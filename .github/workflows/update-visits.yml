name: Update Popular Calculator Visits

on:
  schedule:
    - cron: '0 1 * * *'   # 매일 UTC 01:00 (한국시간 오전 10시)에 실행 - 환율 갱신 1시간 뒤
  workflow_dispatch:        # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update-visits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GA4 client library
        run: npm install @google-analytics/data --no-save

      - name: Fetch GA4 data and update visits
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: node scripts/update-visits.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calculators-data.js en/calculators-data-en.js
          git diff --staged --quiet || git commit -m "Update popular calculator visits ($(date -u +%Y-%m-%d))"
          git diff --staged --quiet || git push
