<script>
// CALCULATORS 배열은 /calculators-data.js 에서 공용으로 관리됩니다.
const CALCULATORS = window.CALCULATORS;

function renderPopular(){
  const wrap = document.getElementById('popularScroll');
  const ranked = CALCULATORS
    .filter(c => c.active && c.visits > 0)
    .sort((a,b) => b.visits - a.visits)
    .slice(0, 10);

  if(ranked.length === 0){
    wrap.innerHTML = '<p style="font-size:12.5px;color:var(--ink-faint);padding:6px 2px;">아직 방문 데이터가 쌓이지 않았어요. 애널리틱스 연동 후 이 자리에 순위가 표시돼요.</p>';
    return;
  }
  wrap.innerHTML = '';
  ranked.forEach((c, i) => {
    const el = document.createElement('a');
    el.href = c.url;
    el.className = 'popular-card';
    el.innerHTML = `
      <div class="rank">${i+1}</div>
      <div class="emoji">${c.emoji}</div>
      <h4>${c.title}</h4>
      <div class="visits">방문 ${c.visits.toLocaleString()}</div>
    `;
    wrap.appendChild(el);
  });
}

// 접힌 카테고리 목록 (브라우저에 저장)
let COLLAPSED = (function(){
  try{ return JSON.parse(localStorage.getItem('collapsedCats')||'[]'); }catch(e){ return []; }
})();
function saveCollapsed(){
  try{ localStorage.setItem('collapsedCats', JSON.stringify(COLLAPSED)); }catch(e){}
}
function bindToggles(){
  document.querySelectorAll('#calcGrid [data-toggle]').forEach(h=>{
    h.addEventListener('click', ()=>{
      const block = h.closest('.cat-block');
      const cat = block.dataset.cat;
      block.classList.toggle('collapsed');
      if(block.classList.contains('collapsed')){
        if(!COLLAPSED.includes(cat)) COLLAPSED.push(cat);
      } else {
        COLLAPSED = COLLAPSED.filter(x=>x!==cat);
      }
      saveCollapsed();
      syncToggleAll();
    });
  });
  syncToggleAll();
}
function syncToggleAll(){
  const btn = document.getElementById('toggleAll');
  if(!btn) return;
  const blocks = document.querySelectorAll('#calcGrid .cat-block');
  const allDone = blocks.length>0 && [...blocks].every(b=>b.classList.contains('collapsed'));
  btn.textContent = allDone ? '전체 펼치기' : '전체 접기';
  btn.style.display = blocks.length>0 ? '' : 'none';
}

const grid = document.getElementById('calcGrid');
const resultLabel = document.getElementById('resultLabel');
let currentCat = 'all';
let currentQuery = '';

function render(){
  const isAll = currentCat === 'all';

  // "전체" 탭에서만 타이틀·인기·최근 섹션을 보여줌
  const searching = currentQuery !== '';
  // 검색 중이면 결과가 위로 오도록 히어로·인기·최근 섹션을 숨김
  document.getElementById('homeHero').style.display = (isAll && !searching) ? '' : 'none';
  document.getElementById('popularSection').style.display = (isAll && !searching) ? '' : 'none';
  document.getElementById('recentSection').style.display = (isAll && !searching) ? '' : 'none';

  const filtered = CALCULATORS.filter(c=>{
    const catMatch = isAll || c.cat === currentCat;
    const qMatch = c.title.toLowerCase().includes(currentQuery) || c.desc.toLowerCase().includes(currentQuery);
    return catMatch && qMatch;
  });

  grid.innerHTML = '';
  resultLabel.textContent = isAll ? '전체 계산기' : currentCat + ' 계산기';

  if(filtered.length === 0){
    grid.className = '';
    grid.innerHTML = '<p style="text-align:center;color:var(--ink-faint);font-size:13px;padding:30px 0;">일치하는 계산기가 없어요.</p>';
    return;
  }

  function cardHtml(c){
    return `
      <a class="calc-item${c.active ? '' : ' disabled'}" href="${c.url}">
        <h3><span class="ci-emoji">${c.emoji}</span>${c.title}</h3>
        <p>${c.desc}</p>
      </a>
    `;
  }

  if(isAll){
    // 전체 탭: 카테고리별로 묶어서 표시 (접기/펼치기 가능)
    grid.className = 'cat-groups';
    const order = [];
    filtered.forEach(c=>{ if(!order.includes(c.cat)) order.push(c.cat); });
    grid.innerHTML = order.map(cat=>{
      const items = filtered.filter(c=>c.cat === cat);
      const collapsed = COLLAPSED.includes(cat) ? ' collapsed' : '';
      return `
        <div class="cat-block${collapsed}" data-cat="${cat}">
          <div class="cat-heading" data-toggle>
            <div class="chev-btn">▾</div>
            <span class="cat-name">${cat}</span>
            <span class="collapsed-tag">접힘</span>
            <span class="cat-line"></span>
            <span class="cat-count">${items.length}</span>
          </div>
          <div class="calc-grid">${items.map(cardHtml).join('')}</div>
        </div>
      `;
    }).join('');
    bindToggles();
  } else {
    // 특정 카테고리 탭: 이미 그 카테고리이므로 제목 줄 없이 목록만
    grid.className = 'calc-grid';
    grid.innerHTML = filtered.map(cardHtml).join('');
  }
}

document.getElementById('navLinks').addEventListener('click', function(e){
  const a = e.target.closest('a[data-cat]');
  if(!a) return;
  e.preventDefault();
  document.querySelectorAll('.nav-links a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  currentCat = a.dataset.cat;
  render();
});

const homeResults = document.getElementById('homeSearchResults');

function renderHomeSuggest(q){
  if(!q){ homeResults.classList.remove('open'); homeResults.innerHTML=''; return; }
  const list = CALCULATORS.filter(c =>
    c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || c.cat.toLowerCase().includes(q)
  );
  homeResults.innerHTML = list.length === 0
    ? '<div class="mini-search-empty">일치하는 계산기가 없어요</div>'
    : list.map(c => `
      <a class="mini-search-item ${c.active ? '' : 'disabled'}" href="${c.active ? c.url : '#'}">
        <span class="ms-emoji">${c.emoji}</span>
        <span class="ms-text">
          <span class="ms-title">${c.title}${c.active ? '' : ' <em>(준비 중)</em>'}</span>
          <span class="ms-desc">${c.desc}</span>
        </span>
      </a>
    `).join('');
  homeResults.classList.add('open');
}

document.getElementById('searchInput').addEventListener('input', function(e){
  currentQuery = e.target.value.trim().toLowerCase();
  renderHomeSuggest(currentQuery);
  render();
});
document.addEventListener('click', function(e){
  if(!e.target.closest('.home-search-wrap')) homeResults.classList.remove('open');
});

document.getElementById('toggleAll').addEventListener('click', function(){
  const blocks = document.querySelectorAll('#calcGrid .cat-block');
  const allDone = [...blocks].every(b=>b.classList.contains('collapsed'));
  COLLAPSED = [];
  blocks.forEach(b=>{
    b.classList.toggle('collapsed', !allDone);
    if(!allDone) COLLAPSED.push(b.dataset.cat);
  });
  saveCollapsed();
  syncToggleAll();
});

// 계산기가 하나도 없는 카테고리 탭은 숨김
document.querySelectorAll('#navLinks a[data-cat]').forEach(a=>{
  const cat = a.dataset.cat;
  if(cat === 'all') return;
  const has = CALCULATORS.some(c=>c.cat === cat);
  if(!has) a.style.display = 'none';
});

render();
renderPopular();
renderRecentCalculators();
</script>
