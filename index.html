<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기서랍 | 생활에 필요한 계산기 모음</title>
<meta name="description" content="환갑, 연봉 실수령액, 대출이자 등 생활에 필요한 계산기를 한 곳에 모아둔 사이트입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-DV1N9XSV70"></script>
<script>
  window.dataLayer = window.dataLayer || [];

  gtag('js', new Date());

<!-- Google AdSense 사이트 연결 코드 -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7656359093051548"
     crossorigin="anonymous"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="brand"><span class="mark"></span>계산기서랍</a>
    <div class="nav-links" id="navLinks">
      <a href="#" class="active" data-cat="all">전체</a>
      <a href="#" data-cat="단위변환">단위변환</a>
      <a href="#" data-cat="일상">일상</a>
      <a href="#" data-cat="금융">금융</a>
      <a href="#" data-cat="건강">건강</a>
      <a href="#" data-cat="학교">학교</a>
      <a href="#" data-cat="직장">직장</a>
      <a href="#" data-cat="부동산">부동산</a>
    </div>
  </div>
</nav>

<div class="home-hero">
  <h1>꺼내 쓰는 계산기서랍</h1>
  <p>복잡하게 검색할 필요 없이, 자주 찾는 계산기를 모아뒀어요. 필요한 걸 눌러서 바로 계산해보세요.</p>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="계산기 이름으로 검색 (예: 환갑, 연봉)">
  </div>
</div>

<div class="popular-section">
  <div class="section-label" style="margin:0 0 12px;padding:0;">🔥 최근 3개월 인기 계산기</div>
  <div class="popular-scroll" id="popularScroll"></div>
</div>

<div class="section-label" id="resultLabel">전체 계산기</div>
<div class="calc-grid" id="calcGrid">
  <!-- JS로 렌더링됨 -->
</div>

<footer>
  <div class="f-brand">계산기서랍</div>
  <div class="f-links">
    <a href="/index.html">홈</a><a href="/about.html">소개</a><a href="/contact.html">문의</a><a href="/privacy.html">개인정보처리방침</a>
  </div>
  <div class="f-copy">© 2026 계산기서랍. All rights reserved.</div>
</footer>

<script src="/calculators-data.js"></script>
<script>
// CALCULATORS 배열은 /calculators-data.js 에서 공용으로 관리됩니다.
const CALCULATORS = window.CALCULATORS;

function renderPopular(){
  const wrap = document.getElementById('popularScroll');
  const ranked = CALCULATORS
    .filter(c => c.active && c.visits > 0)
    .sort((a,b) => b.visits - a.visits)
    .slice(0, 10);

  if(ranked.length === 0){
    wrap.innerHTML = '<p style="font-size:12.5px;color:var(--ink-faint);padding:6px 2px;">아직 방문 데이터가 쌓이지 않았어요. 애널리틱스 연동 후 이 자리에 순위가 표시돼요.</p>';
    return;
  }
  wrap.innerHTML = '';
  ranked.forEach((c, i) => {
    const el = document.createElement('a');
    el.href = c.url;
    el.className = 'popular-card';
    el.innerHTML = `
      <div class="rank">${i+1}</div>
      <div class="emoji">${c.emoji}</div>
      <h4>${c.title}</h4>
      <div class="visits">방문 ${c.visits.toLocaleString()}</div>
    `;
    wrap.appendChild(el);
  });
}

const grid = document.getElementById('calcGrid');
const resultLabel = document.getElementById('resultLabel');
let currentCat = 'all';
let currentQuery = '';

function render(){
  const filtered = CALCULATORS.filter(c=>{
    const catMatch = currentCat === 'all' || c.cat === currentCat;
    const qMatch = c.title.toLowerCase().includes(currentQuery) || c.desc.toLowerCase().includes(currentQuery);
    return catMatch && qMatch;
  });

  grid.innerHTML = '';
  if(filtered.length === 0){
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--ink-faint);font-size:13px;padding:30px 0;">일치하는 계산기가 없어요.</p>';
    return;
  }
  filtered.forEach(c=>{
    const el = document.createElement('a');
    el.href = c.url;
    el.className = 'calc-item' + (c.active ? '' : ' disabled');
    el.innerHTML = `
      <div class="emoji">${c.emoji}</div>
      <div class="cat">${c.cat}</div>
      <h3>${c.title}</h3>
      <p>${c.desc}</p>
    `;
    grid.appendChild(el);
  });
  resultLabel.textContent = currentCat === 'all' ? '전체 계산기' : currentCat + ' 계산기';
}

document.getElementById('navLinks').addEventListener('click', function(e){
  const a = e.target.closest('a[data-cat]');
  if(!a) return;
  e.preventDefault();
  document.querySelectorAll('.nav-links a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  currentCat = a.dataset.cat;
  render();
});

document.getElementById('searchInput').addEventListener('input', function(e){
  currentQuery = e.target.value.trim().toLowerCase();
  render();
});

render();
renderPopular();
</script>
</body>
</html>
