<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기서랍 | 생활에 필요한 계산기 모음</title>
<meta name="description" content="환갑, 연봉 실수령액, 대출이자 등 생활에 필요한 계산기를 한 곳에 모아둔 사이트입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="brand"><span class="mark"></span>계산기서랍</a>
    <div class="nav-links" id="navLinks">
      <a href="#" class="active" data-cat="all">전체</a>
      <a href="#" data-cat="일상">일상</a>
      <a href="#" data-cat="금융">금융</a>
      <a href="#" data-cat="건강">건강</a>
      <a href="#" data-cat="학교">학교</a>
      <a href="#" data-cat="직장">직장</a>
      <a href="#" data-cat="부동산">부동산</a>
      <a href="#" data-cat="단위변환">단위변환</a>
    </div>
  </div>
</nav>

<div class="home-hero">
  <div class="eyebrow">生活工具</div>
  <h1>생활에 필요한 계산기, 한 곳에</h1>
  <p>복잡하게 검색할 필요 없이, 자주 찾는 계산기를 모아뒀어요. 필요한 걸 눌러서 바로 계산해보세요.</p>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="계산기 이름으로 검색 (예: 환갑, 연봉)">
  </div>
</div>

<div class="section-label" id="resultLabel">전체 계산기</div>
<div class="calc-grid" id="calcGrid">
  <!-- JS로 렌더링됨 -->
</div>

<footer>
  <div class="f-brand">계산기서랍</div>
  <div class="f-links">
    <a href="/index.html">홈</a><a href="#">전체 계산기</a><a href="#">개인정보처리방침</a>
  </div>
  <div class="f-copy">© 2026 계산기서랍. All rights reserved.</div>
</footer>

<script>
// 계산기가 늘어날 때마다 이 배열에 한 줄씩 추가하면 홈 화면 카드가 자동으로 생깁니다.
const CALCULATORS = [
  {
    emoji: '🎊',
    cat: '일상',
    title: '환갑 계산기',
    desc: '생년월일로 환갑·진갑·고희 등 전통 나이 이정표와 D-Day를 계산해요.',
    url: '/calculators/hwangap.html',
    active: true
  },
  {
    emoji: '💰',
    cat: '금융',
    title: '연봉 실수령액 계산기',
    desc: '세금·4대보험 공제 후 실제로 받는 월급을 계산해요.',
    url: '#',
    active: false
  },
  {
    emoji: '🏦',
    cat: '금융',
    title: '대출이자 계산기',
    desc: '원리금균등/원금균등 방식별 월 상환액을 계산해요.',
    url: '#',
    active: false
  },
];

const grid = document.getElementById('calcGrid');
const resultLabel = document.getElementById('resultLabel');
let currentCat = 'all';
let currentQuery = '';

function render(){
  const filtered = CALCULATORS.filter(c=>{
    const catMatch = currentCat === 'all' || c.cat === currentCat;
    const qMatch = c.title.toLowerCase().includes(currentQuery) || c.desc.toLowerCase().includes(currentQuery);
    return catMatch && qMatch;
  });

  grid.innerHTML = '';
  if(filtered.length === 0){
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--ink-faint);font-size:13px;padding:30px 0;">일치하는 계산기가 없어요.</p>';
    return;
  }
  filtered.forEach(c=>{
    const el = document.createElement('a');
    el.href = c.url;
    el.className = 'calc-item' + (c.active ? '' : ' disabled');
    el.innerHTML = `
      <div class="emoji">${c.emoji}</div>
      <div class="cat">${c.cat}</div>
      <h3>${c.title}</h3>
      <p>${c.desc}</p>
    `;
    grid.appendChild(el);
  });
  resultLabel.textContent = currentCat === 'all' ? '전체 계산기' : currentCat + ' 계산기';
}

document.getElementById('navLinks').addEventListener('click', function(e){
  const a = e.target.closest('a[data-cat]');
  if(!a) return;
  e.preventDefault();
  document.querySelectorAll('.nav-links a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  currentCat = a.dataset.cat;
  render();
});

document.getElementById('searchInput').addEventListener('input', function(e){
  currentQuery = e.target.value.trim().toLowerCase();
  render();
});

render();
</script>
</body>
</html>
