<script>
// CALCULATORS 배열은 /calculators-data.js 에서 공용으로 관리됩니다.
const CALCULATORS = window.CALCULATORS;

function renderPopular(){
  const wrap = document.getElementById('popularScroll');
  const ranked = CALCULATORS
    .filter(c => c.active && c.visits > 0)
    .sort((a,b) => b.visits - a.visits)
    .slice(0, 10);

  if(ranked.length === 0){
    wrap.innerHTML = '<p style="font-size:12.5px;color:var(--ink-faint);padding:6px 2px;">아직 방문 데이터가 쌓이지 않았어요. 애널리틱스 연동 후 이 자리에 순위가 표시돼요.</p>';
    return;
  }
  wrap.innerHTML = '';
  ranked.forEach((c, i) => {
    const el = document.createElement('a');
    el.href = c.url;
    el.className = 'popular-card';
    el.innerHTML = `
      <div class="rank">${i+1}</div>
      <div class="emoji">${c.emoji}</div>
      <h4>${c.title}</h4>
      <div class="visits">방문 ${c.visits.toLocaleString()}</div>
    `;
    wrap.appendChild(el);
  });
}

// 접힌 카테고리 목록 (브라우저에 저장)
let COLLAPSED = (function(){
  try{ return JSON.parse(localStorage.getItem('collapsedCats')||'[]'); }catch(e){ return []; }
})();
function saveCollapsed(){
  try{ localStorage.setItem('collapsedCats', JSON.stringify(COLLAPSED)); }catch(e){}
}
function bindToggles(){
  document.querySelectorAll('#calcGrid [data-toggle]').forEach(h=>{
    h.addEventListener('click', ()=>{
      const block = h.closest('.cat-block');
      const cat = block.dataset.cat;
      const isSub = h.dataset.sub === '1';

      block.classList.toggle('collapsed');
      const nowCollapsed = block.classList.contains('collapsed');
      if(nowCollapsed){ if(!COLLAPSED.includes(cat)) COLLAPSED.push(cat); }
      else { COLLAPSED = COLLAPSED.filter(x=>x!==cat); }

      if(isSub){
        // 하위 그룹을 건드렸으면, 부모(상위 카테고리)의 접힘 상태를 자식들 기준으로 동기화
        syncParentFromChildren(block.dataset.parent);
      } else {
        // 상위 카테고리 헤더를 직접 눌렀으면, 하위 그룹 전체를 같은 상태로 맞춤(연쇄 적용)
        const wrap = block.querySelector('.subgroup-wrap');
        if(wrap){
          wrap.querySelectorAll('.sub-block').forEach(sb=>{
            sb.classList.toggle('collapsed', nowCollapsed);
            const subKey = sb.dataset.cat;
            if(nowCollapsed){ if(!COLLAPSED.includes(subKey)) COLLAPSED.push(subKey); }
            else { COLLAPSED = COLLAPSED.filter(x=>x!==subKey); }
          });
        }
      }
      saveCollapsed();
      syncToggleAll();
    });
  });
  syncToggleAll();
}
// 하위 그룹 중 하나라도 펼쳐져 있으면 부모는 "펼쳐진" 모양으로, 전부 접혀있으면 "접힌" 모양으로 맞춤
function syncParentFromChildren(parentCat){
  if(!parentCat) return;
  const parentBlock = document.querySelector(`#calcGrid .cat-block[data-cat="${parentCat}"]`);
  if(!parentBlock) return;
  const children = parentBlock.querySelectorAll('.sub-block');
  if(!children.length) return;
  const anyOpen = [...children].some(c=>!c.classList.contains('collapsed'));
  parentBlock.classList.toggle('collapsed', !anyOpen);
  if(!anyOpen){ if(!COLLAPSED.includes(parentCat)) COLLAPSED.push(parentCat); }
  else { COLLAPSED = COLLAPSED.filter(x=>x!==parentCat); }
}
function syncToggleAll(){
  const btn = document.getElementById('toggleAll');
  if(!btn) return;
  // 최상위 카테고리 블록만 카운트 (중첩된 sub-block은 전체접기 토글 판단에서 제외)
  const blocks = document.querySelectorAll('#calcGrid > .cat-block');
  const allDone = blocks.length>0 && [...blocks].every(b=>b.classList.contains('collapsed'));
  btn.textContent = allDone ? '전체 펼치기' : '전체 접기';
  btn.style.display = blocks.length>0 ? '' : 'none';
}

const grid = document.getElementById('calcGrid');
const resultLabel = document.getElementById('resultLabel');
let currentCat = 'all';
let currentQuery = '';

function render(){
  const isAll = currentCat === 'all';

  // "전체" 탭에서만 타이틀·인기·최근 섹션을 보여줌
  const searching = currentQuery !== '';
  // 검색 중이면 결과가 위로 오도록 히어로·인기·최근 섹션을 숨김
  document.getElementById('homeHero').style.display = (isAll && !searching) ? '' : 'none';
  document.getElementById('popularSection').style.display = (isAll && !searching) ? '' : 'none';
  document.getElementById('recentSection').style.display = (isAll && !searching) ? '' : 'none';

  // 특정 카테고리 선택 시 소개 문구 표시
  const descLine = document.getElementById('catDescLine');
  if(descLine){
    const desc = (window.CATEGORY_DESC || {})[currentCat];
    if(!isAll && desc){
      descLine.textContent = desc;
      descLine.style.display = 'block';
    } else {
      descLine.style.display = 'none';
    }
  }

  const filtered = CALCULATORS.filter(c=>{
    const catMatch = isAll || c.cat === currentCat;
    const qMatch = c.title.toLowerCase().includes(currentQuery) || c.desc.toLowerCase().includes(currentQuery);
    return catMatch && qMatch;
  });

  grid.innerHTML = '';
  resultLabel.textContent = isAll ? '전체 계산기' : currentCat + ' 계산기';

  if(filtered.length === 0){
    grid.className = '';
    grid.innerHTML = '<p style="text-align:center;color:var(--ink-faint);font-size:13px;padding:30px 0;">일치하는 계산기가 없어요.</p>';
    return;
  }

  function cardHtml(c){
    return `
      <a class="calc-item${c.active ? '' : ' disabled'}" href="${c.url}">
        <h3><span class="ci-emoji">${c.emoji}</span>${c.title}</h3>
        <p>${c.desc}</p>
      </a>
    `;
  }

  // 카테고리 안에서 subcat(초등/학생 등)으로 다시 묶어서, 들여쓰기+접기 가능한 소제목으로 렌더링
  function renderWithSubgroups(items, catKey){
    const plain = items.filter(c => !c.subcat);
    const subOrder = (window.SUBCAT_ORDER || []).filter(s => items.some(c => c.subcat === s));
    let html = plain.length ? `<div class="calc-grid">${plain.map(cardHtml).join('')}</div>` : '';
    if(subOrder.length){
      html += `<div class="subgroup-wrap">`;
      subOrder.forEach(sub=>{
        const subItems = items.filter(c => c.subcat === sub);
        if(!subItems.length) return;
        const subKey = catKey + ':' + sub;
        const collapsed = COLLAPSED.includes(subKey) ? ' collapsed' : '';
        html += `
          <div class="cat-block sub-block${collapsed}" data-cat="${subKey}" data-parent="${catKey}">
            <div class="cat-heading sub-heading" data-toggle data-sub="1">
              <div class="chev-btn">▾</div>
              <span class="cat-name sub-name">${sub}</span>
              <span class="collapsed-tag">접힘</span>
              <span class="cat-line"></span>
              <span class="cat-count">${subItems.length}</span>
            </div>
            <div class="calc-grid">${subItems.map(cardHtml).join('')}</div>
          </div>
        `;
      });
      html += `</div>`;
    }
    return html;
  }

  if(isAll){
    // 전체 탭: 카테고리별로 묶어서 표시 (상단 탭과 동일한 CATEGORY_ORDER 순서를 따름)
    grid.className = 'cat-groups';
    const order = [];
    filtered.forEach(c=>{ if(!order.includes(c.cat)) order.push(c.cat); });
    const catOrder = window.CATEGORY_ORDER || [];
    order.sort((a,b)=>{
      const ia = catOrder.indexOf(a), ib = catOrder.indexOf(b);
      return (ia<0?99:ia) - (ib<0?99:ib);
    });
    grid.innerHTML = order.map(cat=>{
      const items = filtered.filter(c=>c.cat === cat);
      const collapsed = COLLAPSED.includes(cat) ? ' collapsed' : '';
      return `
        <div class="cat-block${collapsed}" data-cat="${cat}">
          <div class="cat-heading" data-toggle>
            <div class="chev-btn">▾</div>
            <span class="cat-name">${cat}</span>
            <span class="collapsed-tag">접힘</span>
            <span class="cat-line"></span>
            <span class="cat-count">${items.length}</span>
          </div>
          ${renderWithSubgroups(items, cat)}
        </div>
      `;
    }).join('');
    bindToggles();
    // 초기 렌더 시에도 부모(예: 일반)의 접힘 모양을 자식 상태 기준으로 맞춤
    document.querySelectorAll('#calcGrid > .cat-block').forEach(b=>{
      if(b.querySelector('.subgroup-wrap')) syncParentFromChildren(b.dataset.cat);
    });
  } else {
    // 특정 카테고리 탭: 제목 줄 없이 목록만 (subcat 있으면 구분선+소제목으로 묶음)
    const hasSub = filtered.some(c => c.subcat);
    if(hasSub){
      grid.className = 'cat-groups';
      grid.innerHTML = renderWithSubgroups(filtered, currentCat);
      bindToggles();
    } else {
      grid.className = 'calc-grid';
      grid.innerHTML = filtered.map(cardHtml).join('');
    }
  }
}

document.getElementById('navLinks').addEventListener('click', function(e){
  const a = e.target.closest('a[data-cat]');
  if(!a) return;
  e.preventDefault();
  document.querySelectorAll('.nav-links a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  currentCat = a.dataset.cat;
  render();
});

const homeResults = document.getElementById('homeSearchResults');

function renderHomeSuggest(q){
  if(!q){ homeResults.classList.remove('open'); homeResults.innerHTML=''; return; }
  const list = CALCULATORS.filter(c =>
    c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || c.cat.toLowerCase().includes(q)
  );
  homeResults.innerHTML = list.length === 0
    ? '<div class="mini-search-empty">일치하는 계산기가 없어요</div>'
    : list.map(c => `
      <a class="mini-search-item ${c.active ? '' : 'disabled'}" href="${c.active ? c.url : '#'}">
        <span class="ms-emoji">${c.emoji}</span>
        <span class="ms-text">
          <span class="ms-title">${c.title}${c.active ? '' : ' <em>(준비 중)</em>'}</span>
          <span class="ms-desc">${c.desc}</span>
        </span>
      </a>
    `).join('');
  homeResults.classList.add('open');
}

document.getElementById('searchInput').addEventListener('input', function(e){
  currentQuery = e.target.value.trim().toLowerCase();
  renderHomeSuggest(currentQuery);
  render();
});
document.addEventListener('click', function(e){
  if(!e.target.closest('.home-search-wrap')) homeResults.classList.remove('open');
});

document.getElementById('toggleAll').addEventListener('click', function(){
  const blocks = document.querySelectorAll('#calcGrid .cat-block');
  const allDone = [...blocks].every(b=>b.classList.contains('collapsed'));
  COLLAPSED = [];
  blocks.forEach(b=>{
    b.classList.toggle('collapsed', !allDone);
    if(!allDone) COLLAPSED.push(b.dataset.cat);
  });
  saveCollapsed();
  syncToggleAll();
});

// 카테고리 탭을 계산기 목록에서 자동 생성 (누락·불일치 방지)
(function buildTabs(){
  const order = window.CATEGORY_ORDER || [];
  const present = [];
  CALCULATORS.forEach(c=>{ if(!present.includes(c.cat)) present.push(c.cat); });
  present.sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  const nav = document.getElementById('navLinks');
  nav.innerHTML = '<a href="#" class="active" data-cat="all">전체</a>'
    + present.map(cat=>`<a href="#" data-cat="${cat}">${cat}</a>`).join('');
})();

// 다른 페이지에서 #카테고리 로 들어온 경우 해당 탭을 자동 선택
(function applyHash(){
  const h = decodeURIComponent(location.hash.replace('#',''));
  if(!h) return;
  const tab = document.querySelector(`#navLinks a[data-cat="${h}"]`);
  if(tab){
    document.querySelectorAll('#navLinks a').forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    currentCat = h;
  }
})();

render();
renderPopular();
renderRecentCalculators();
</script>
