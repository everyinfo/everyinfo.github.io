<script src="/calc-engine.js"></script>
<script>
  initCalculator('percent');
  renderRelatedSections('/calculators/percent.html');
  recordRecentCalculator('/calculators/percent.html');
  (function(){
    const input=document.getElementById('siteSearch'), results=document.getElementById('siteSearchResults');
    if(!input) return;
    input.addEventListener('input',function(){
      const q=input.value.trim().toLowerCase();
      if(!q){results.classList.remove('open');results.innerHTML='';return;}
      const list=(window.CALCULATORS||[]).filter(c=>c.title.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q)||c.cat.toLowerCase().includes(q));
      results.innerHTML=list.length===0?'<div class="mini-search-empty">일치하는 계산기가 없어요</div>'
        :list.map(c=>`<a class="mini-search-item ${c.active?'':'disabled'}" href="${c.active?c.url:'#'}"><span class="ms-emoji">${c.emoji}</span><span class="ms-text"><span class="ms-title">${c.title}${c.active?'':' <em>(준비 중)</em>'}</span><span class="ms-desc">${c.desc}</span></span></a>`).join('');
      results.classList.add('open');
    });
    document.addEventListener('click',function(e){if(!e.target.closest('.mini-search-wrap'))results.classList.remove('open');});
  })();
</script>
